<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="theme-color" content="#5b44d8">
<title>پنل فروش زهرا v1.1 · هفت قلم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--p:#6848e8;--p2:#8d6cff;--bg:#f4f5fb;--card:#fff;--text:#20263a;--muted:#778097;--line:#e3e6ef;--green:#0a8f61;--red:#c93f54;--orange:#b9650b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.shell{max-width:980px;margin:auto;padding:14px 14px 90px}.top{position:sticky;top:0;z-index:20;background:rgba(244,245,251,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(220,223,234,.8);padding:12px 14px}.topin{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 10px 30px rgba(104,72,232,.26)}.brand strong{display:block}.brand small{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 30px rgba(34,42,74,.05);margin-bottom:12px}.hero{background:linear-gradient(135deg,#211b51,#5d43d6);color:#fff;border:0;padding:18px}.hero p{color:#dcd7ff;margin:5px 0 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}.kpi span{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.kpi strong{font-size:18px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center}.navin{width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:none;border:0;padding:9px 4px;color:#7a8296;font-size:11px}.nav button.active{color:var(--p);font-weight:900}.nav b{display:block;font-size:20px;line-height:1.2}.title{font-size:18px;font-weight:900;margin-bottom:3px}.sub{font-size:12px;color:var(--muted);line-height:1.8}.field{margin-bottom:10px}.field label{display:block;font-size:11px;font-weight:800;color:#646d82;margin-bottom:5px}.input,.select,.textarea{width:100%;border:1px solid #dce0eb;background:#fff;border-radius:12px;padding:10px 11px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:#8c72f0;box-shadow:0 0 0 3px rgba(104,72,232,.08)}.textarea{min-height:88px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:900;background:#eceef5;color:#3f475d}.btn.primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}.btn.green{background:#e6fff3;color:#087550}.btn.danger{background:#fff0f2;color:#b53248}.actions{display:flex;gap:7px;flex-wrap:wrap}.status{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef1f7;color:#5d657a;font-size:10px;font-weight:900}.status.submitted{background:#fff3d7;color:#945c00}.status.approved,.status.converted,.status.payable,.status.paid{background:#e8fff4;color:#08754f}.status.needs_revision,.status.partially_paid{background:#fff1e5;color:#a45108}.status.rejected,.status.cancelled,.status.reversed{background:#fff0f2;color:#ad3045}.item{border:1px dashed #d7dbea;border-radius:14px;padding:10px;margin-top:8px}.itemhead{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{color:var(--muted);font-size:11px;line-height:1.8}.money{font-weight:900}.empty{text-align:center;color:#8991a4;padding:28px}.auth{max-width:520px;margin:40px auto}.mono{direction:ltr;text-align:left;font-family:ui-monospace,monospace;word-break:break-all;font-size:11px}.notice{padding:10px 12px;border-radius:12px;background:#f0edff;color:#5140a4;font-size:12px;line-height:1.8;margin-bottom:10px}.warn{background:#fff4dc;color:#8d5a00}.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.2s;background:#20263a;color:white;padding:10px 14px;border-radius:13px;font-weight:800;z-index:100}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{background:#b93349}
.product-picker{position:relative}.product-results{position:absolute;z-index:60;right:0;left:0;top:100%;margin-top:5px;background:#fff;border:1px solid #dce0eb;border-radius:13px;box-shadow:0 18px 45px rgba(32,38,58,.16);max-height:280px;overflow:auto}.product-result{padding:10px 12px;border-bottom:1px solid #eef0f5;cursor:pointer}.product-result:last-child{border-bottom:0}.product-result:hover{background:#f6f4ff}.product-result strong{display:block;font-size:12px}.product-result small{display:flex;gap:8px;flex-wrap:wrap;color:#7a8296;margin-top:3px}.product-selected{margin-top:6px;padding:7px 9px;border-radius:10px;background:#eefbf5;color:#087550;font-size:11px}.product-help{font-size:10px;color:#8b93a6;margin-top:5px}.product-loading{padding:12px;text-align:center;color:#7a8296;font-size:11px}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.shell{padding-left:10px;padding-right:10px}.top{padding-left:10px;padding-right:10px}.top .btn span{display:none}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand"><div class="logo">ه</div><div><strong>پنل فروش زهرا</strong><small>شبکه فروش هفت قلم · v1.1</small></div></div><button class="btn" id="logoutBtn"><span>خروج</span> ↩</button></div></header>
<main class="shell" id="app"></main>
<nav class="nav" id="nav"><div class="navin"><button data-view="home" class="active"><b>🏠</b>خانه</button><button data-view="new"><b>➕</b>ثبت فروش</button><button data-view="requests"><b>🧾</b>درخواست‌ها</button><button data-view="customers"><b>👥</b>مشتری‌ها</button><button data-view="earnings"><b>💰</b>سهم من</button></div></nav>
<div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const PROJECT_URL_DEFAULT='https://segfnoaagfsrwkqkwkye.supabase.co';
const CFG_KEY='hg_zahra_supabase_config_v1',AUTH_KEY='hg_zahra_auth_v1';
const state={view:'home',session:null,profile:null,agent:null,requests:[],items:[],commissions:[],settlements:[],editing:null,catalogCache:new Map()};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=n=>Number(n||0).toLocaleString('fa-IR',{maximumFractionDigits:0}),money=n=>fa(Math.round(Number(n)||0))+' تومان';
const num=v=>{let s=String(v??'').trim().replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[٬,\s]/g,'');const n=Number(s);return Number.isFinite(n)?n:0};
const statusLabel={draft:'پیش‌نویس',submitted:'در انتظار بررسی',needs_revision:'نیازمند اصلاح',approved:'تأییدشده',rejected:'ردشده',converted:'تبدیل به سفارش',cancelled:'لغوشده',estimated:'برآوردی',pending_collection:'در انتظار وصول',payable:'قابل پرداخت',partially_paid:'بخشی پرداخت شده',paid:'پرداخت شده',reversed:'برگشت خورده'};
const payLabel={cash:'نقدی',snapp_pay:'اسنپ‌پی',site_gateway:'درگاه سایت',direct_installment:'اقساط مستقیم',other:'سایر'};
function toast(m,e=false){const x=$('#toast');x.textContent=m;x.classList.toggle('err',e);x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2600)}
function cfg(){try{return {...{url:PROJECT_URL_DEFAULT,key:''},...JSON.parse(localStorage.getItem(CFG_KEY)||'{}')}}catch{return{url:PROJECT_URL_DEFAULT,key:''}}}
function saveCfg(v){localStorage.setItem(CFG_KEY,JSON.stringify(v))}
function loadSession(){try{state.session=JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch{state.session=null}return state.session}
function saveSession(v){state.session=v||null;if(v)localStorage.setItem(AUTH_KEY,JSON.stringify(v));else localStorage.removeItem(AUTH_KEY)}
function authHeaders(token){const c=cfg();return{apikey:c.key,Authorization:`Bearer ${token||c.key}`,'Content-Type':'application/json'}}
async function auth(path,body){const c=cfg();if(!c.key)throw Error('Publishable key تنظیم نشده');const r=await fetch(`${c.url}/auth/v1/${path}`,{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d?.msg||d?.error_description||d?.message||`HTTP ${r.status}`);return d}
async function api(path,opt={}){const c=cfg();if(!state.session?.access_token)throw Error('ابتدا وارد شو');const h=authHeaders(state.session.access_token);if(opt.prefer)h.Prefer=opt.prefer;let r=await fetch(c.url+path,{method:opt.method||'GET',headers:h,body:opt.body===undefined?undefined:JSON.stringify(opt.body)});if(r.status===401&&state.session?.refresh_token){try{const d=await auth('token?grant_type=refresh_token',{refresh_token:state.session.refresh_token});saveSession(d);return api(path,{...opt,retry:false})}catch{}}const raw=await r.text();let d;try{d=raw?JSON.parse(raw):null}catch{d=raw}if(!r.ok)throw Error(d?.message||d?.hint||`HTTP ${r.status}`);return d}
const get=(t,q='')=>api(`/rest/v1/${t}${q?'?'+q:''}`),post=(t,b,p='return=representation')=>api(`/rest/v1/${t}`,{method:'POST',body:b,prefer:p}),patch=(t,q,b)=>api(`/rest/v1/${t}?${q}`,{method:'PATCH',body:b,prefer:'return=representation'});
const rpc=(fn,b={})=>api(`/rest/v1/rpc/${fn}`,{method:'POST',body:b});
async function searchCatalog(q=''){const key=String(q||'').trim().toLowerCase();if(state.catalogCache.has(key))return state.catalogCache.get(key);const rows=await rpc('hg_sales_product_catalog',{q:key||null,p_limit:60});const out=Array.isArray(rows)?rows:[];state.catalogCache.set(key,out);if(state.catalogCache.size>40){const first=state.catalogCache.keys().next().value;state.catalogCache.delete(first)}return out}
function normalizePhone(s){let p=String(s||'').replace(/\D+/g,'');if(p.startsWith('0098'))p='0'+p.slice(4);else if(p.startsWith('98'))p='0'+p.slice(2);else if(/^9\d{9}$/.test(p))p='0'+p;return p}
function status(s){return `<span class="status ${esc(s)}">${esc(statusLabel[s]||s||'—')}</span>`}
function nav(show=true){$('#nav').classList.toggle('hidden',!show);$('#logoutBtn').classList.toggle('hidden',!show)}
function configScreen(){nav(false);$('#app').innerHTML=`<div class="auth card"><div class="title">تنظیم اولیه اتصال</div><div class="sub">این مرحله یک‌بار انجام می‌شود. فقط Publishable/anon key را وارد کن؛ service_role وارد نکن.</div><div class="notice">آدرس پروژه از قبل روی هفت قلم تنظیم شده است.</div><div class="field"><label>Project URL</label><input class="input mono" id="cfgUrl" value="${esc(cfg().url||PROJECT_URL_DEFAULT)}"></div><div class="field"><label>Publishable / anon key</label><textarea class="textarea mono" id="cfgKey" placeholder="sb_publishable_... یا anon JWT"></textarea></div><button class="btn primary" id="saveCfg">ذخیره و ادامه</button></div>`;$('#saveCfg').onclick=()=>{const url=$('#cfgUrl').value.trim().replace(/\/+$/,''),key=$('#cfgKey').value.trim();if(!url||!key){toast('URL و کلید را کامل وارد کن',true);return}saveCfg({url,key});loginScreen()}}
function loginScreen(){if(!cfg().key){configScreen();return}nav(false);$('#app').innerHTML=`<div class="auth card"><div class="title">ورود زهرا</div><div class="sub">فقط درخواست‌ها، مشتری‌ها و سهم خودت را می‌بینی.</div><div class="field"><label>ایمیل</label><input class="input" id="email" type="email" autocomplete="username"></div><div class="field"><label>رمز عبور</label><input class="input" id="pass" type="password" autocomplete="current-password"></div><div class="actions"><button class="btn primary" id="login">ورود</button><button class="btn" id="signup">ساخت حساب</button><button class="btn" id="reconfig">تنظیم اتصال</button></div><div class="sub" style="margin-top:10px">اگر حساب را تازه ساختی و ایمیل تأیید فعال است، ابتدا ایمیل Supabase را تأیید کن.</div></div>`;$('#login').onclick=async()=>{try{const d=await auth('token?grant_type=password',{email:$('#email').value.trim(),password:$('#pass').value});saveSession(d);await loadAll();render()}catch(e){toast(e.message,true)}};$('#signup').onclick=async()=>{try{const d=await auth('signup',{email:$('#email').value.trim(),password:$('#pass').value});if(d.access_token){saveSession(d);await loadAll();render()}else toast('حساب ساخته شد؛ ایمیل تأیید را بررسی کن ✅')}catch(e){toast(e.message,true)}};$('#reconfig').onclick=configScreen}
async function loadAll(){const uid=state.session?.user?.id;if(!uid)throw Error('شناسه کاربر دریافت نشد');const prof=await get('sales_app_users',`select=*&user_id=eq.${encodeURIComponent(uid)}&limit=1`);state.profile=prof?.[0]||null;if(!state.profile||state.profile.role!=='agent'){state.agent=null;return}const [ag,rs,it,co,se]=await Promise.all([get('sales_agents',`select=*&id=eq.${encodeURIComponent(state.profile.agent_id)}&limit=1`),get('sales_requests','select=*&order=created_at.desc&limit=500'),get('sales_request_items','select=*&order=created_at.asc&limit=2000'),get('agent_commissions','select=*&order=created_at.desc&limit=1000'),get('agent_settlements','select=*&order=created_at.desc&limit=1000')]);state.agent=ag?.[0]||null;state.requests=rs||[];state.items=it||[];state.commissions=co||[];state.settlements=se||[]}
function pendingLink(){nav(false);const uid=state.session?.user?.id||'';$('#app').innerHTML=`<div class="auth card"><div class="title">حساب ساخته شد ✅</div><div class="sub">مدیر هفت قلم باید این حساب را یک‌بار به پروفایل «زهرا» متصل کند.</div><div class="notice">این شناسه را برای مدیر بفرست:</div><div class="card mono" id="uidBox">${esc(uid)}</div><div class="actions"><button class="btn primary" id="copyUid">کپی شناسه</button><button class="btn" id="retry">بررسی مجدد</button><button class="btn danger" id="logoutPending">خروج</button></div></div>`;$('#copyUid').onclick=async()=>{await navigator.clipboard.writeText(uid);toast('شناسه کپی شد ✅')};$('#retry').onclick=async()=>{try{await loadAll();render()}catch(e){toast(e.message,true)}};$('#logoutPending').onclick=()=>{saveSession(null);loginScreen()}}
function viewItems(reqId){return state.items.filter(x=>x.request_id===reqId)}
function home(){const conv=state.requests.filter(r=>r.status==='converted'),sales=conv.reduce((s,r)=>s+num(r.manager_total??r.declared_total),0),comm=state.commissions.reduce((s,c)=>s+num(c.commission_amount),0),paid=state.commissions.reduce((s,c)=>s+num(c.paid_amount),0),pending=state.requests.filter(r=>r.status==='submitted').length;return `<div class="card hero"><div class="title">سلام ${esc(state.agent?.display_name||'زهرا')} 👋</div><p>فروش‌هایت را ثبت کن؛ مدیر بررسی می‌کند و سهمت بعد از محاسبه واقعی نمایش داده می‌شود.</p></div><div class="grid"><div class="kpi"><span>در انتظار بررسی</span><strong>${fa(pending)}</strong></div><div class="kpi"><span>فروش تأییدشده</span><strong>${money(sales)}</strong></div><div class="kpi"><span>سهم محاسبه‌شده</span><strong>${money(comm)}</strong></div><div class="kpi"><span>مانده سهم من</span><strong>${money(Math.max(0,comm-paid))}</strong></div></div><div class="card" style="margin-top:12px"><div class="title">آخرین درخواست‌ها</div>${state.requests.slice(0,5).map(r=>requestCard(r)).join('')||'<div class="empty">هنوز فروشی ثبت نکرده‌ای.</div>'}</div>`}
function requestCard(r){const its=viewItems(r.id);return `<div class="item"><div class="itemhead"><div><strong>#${fa(r.request_no)} · ${esc(r.customer_name)}</strong><div class="muted">${esc(payLabel[r.payment_method]||r.payment_method)} · ${fa(its.reduce((s,x)=>s+num(x.quantity),0))} قلم</div></div><div style="text-align:left">${status(r.status)}<div class="money">${money(r.manager_total??r.declared_total)}</div></div></div>${r.manager_note?`<div class="notice" style="margin-top:8px">پیام مدیر: ${esc(r.manager_note)}</div>`:''}</div>`}
function requests(){return `<div class="card"><div class="title">درخواست‌های من</div><div class="sub">فقط درخواست‌های مربوط به حساب تو نمایش داده می‌شود.</div>${state.requests.map(r=>requestCard(r)).join('')||'<div class="empty">هنوز درخواستی نداری.</div>'}</div>`}
function customers(){const m=new Map();state.requests.forEach(r=>{const p=normalizePhone(r.customer_phone),k=p||r.customer_name;if(!k)return;const x=m.get(k)||{name:r.customer_name,phone:p,count:0,sales:0,last:r.created_at};x.count++;x.sales+=num(r.manager_total??r.declared_total);if(String(r.created_at)>String(x.last))x.last=r.created_at;m.set(k,x)});const rows=[...m.values()].sort((a,b)=>String(b.last).localeCompare(String(a.last)));return `<div class="card"><div class="title">مشتری‌های من</div>${rows.length?rows.map(x=>`<div class="item"><div class="itemhead"><div><strong>${esc(x.name||'بدون نام')}</strong><div class="muted">${esc(x.phone||'بدون شماره')} · ${fa(x.count)} سفارش</div></div><div class="money">${money(x.sales)}</div></div></div>`).join(''):'<div class="empty">هنوز مشتری‌ای ثبت نشده است.</div>'}</div>`}
function earnings(){const total=state.commissions.reduce((s,c)=>s+num(c.commission_amount),0),paid=state.commissions.reduce((s,c)=>s+num(c.paid_amount),0),payable=state.commissions.filter(c=>['payable','partially_paid'].includes(c.status)).reduce((s,c)=>s+Math.max(0,num(c.commission_amount)-num(c.paid_amount)),0);return `<div class="grid"><div class="kpi"><span>کل سهم من</span><strong>${money(total)}</strong></div><div class="kpi"><span>قابل پرداخت</span><strong>${money(payable)}</strong></div><div class="kpi"><span>پرداخت‌شده</span><strong>${money(paid)}</strong></div><div class="kpi"><span>مانده</span><strong>${money(Math.max(0,total-paid))}</strong></div></div><div class="card" style="margin-top:12px"><div class="title">ریز پورسانت</div>${state.commissions.map(c=>{const r=state.requests.find(x=>x.id===c.request_id);return `<div class="item"><div class="itemhead"><div><strong>درخواست #${fa(r?.request_no||0)}</strong><div class="muted">کل ${money(c.commission_amount)} · پرداخت ${money(c.paid_amount)}</div></div><div>${status(c.status)}</div></div></div>`}).join('')||'<div class="empty">هنوز پورسانتی محاسبه نشده است.</div>'}</div><div class="card"><div class="title">تسویه‌ها</div>${state.settlements.map(s=>`<div class="item"><div class="itemhead"><div><strong>${money(s.amount)}</strong><div class="muted">${s.paid_at?new Date(s.paid_at).toLocaleString('fa-IR'):'—'} · ${esc(s.payment_method||'—')}</div></div>${status(s.status)}</div></div>`).join('')||'<div class="empty">هنوز تسویه‌ای ثبت نشده است.</div>'}</div>`}
function newSale(){return `<div class="card"><div class="title">ثبت فروش جدید</div><div class="sub">محصول را از دیتای اصلی هفت قلم جستجو و انتخاب کن. قیمت خرید و سود داخلی فروشگاه نمایش داده نمی‌شود.</div><div class="row" style="margin-top:12px"><div class="field"><label>نام مشتری *</label><input class="input" id="custName"></div><div class="field"><label>شماره موبایل</label><input class="input" id="custPhone" inputmode="tel"></div><div class="field"><label>روش پرداخت *</label><select class="select" id="pay"><option value="cash">نقدی</option><option value="snapp_pay">اسنپ‌پی</option><option value="site_gateway">درگاه سایت</option><option value="direct_installment">اقساط مستقیم</option><option value="other">سایر</option></select></div><div class="field"><label>منبع مشتری</label><input class="input" id="source" placeholder="مثلاً اینستاگرام / معرفی"></div></div><div class="title" style="font-size:15px">محصولات</div><div id="items"></div><div class="actions" style="margin:8px 0 12px"><button class="btn" id="addItem">+ افزودن محصول</button></div><div class="field"><label>توضیح</label><textarea class="textarea" id="note"></textarea></div><div class="notice">جمع فروش: <strong id="grand">۰ تومان</strong></div><div class="actions"><button class="btn primary" id="submitSale">ارسال برای مدیر</button></div></div>`}
function itemRow(v={}){const d=document.createElement('div');d.className='item saleitem';d.dataset.productRef=v.product_ref||'';d.innerHTML=`<div class="row"><div class="field product-picker"><label>محصول *</label><input class="input psearch" autocomplete="off" placeholder="نام محصول را جستجو کن…" value="${esc(v.name||'')}"><div class="product-results hidden"></div><div class="product-selected ${v.product_ref?'':'hidden'}"></div><div class="product-help">انتخاب از کاتالوگ اصلی هفت قلم الزامی است.</div></div><div class="field"><label>تعداد</label><input class="input qty" inputmode="numeric" value="${esc(v.qty||1)}"></div><div class="field"><label>قیمت فروش واحد (تومان) *</label><input class="input price" inputmode="numeric" value="${esc(v.price||'')}"></div><div class="field"><label>تخفیف این قلم</label><input class="input disc" inputmode="numeric" value="${esc(v.discount||0)}"></div></div><div class="actions"><button class="btn danger remove">حذف</button></div>`;
const inp=$('.psearch',d),box=$('.product-results',d),sel=$('.product-selected',d),price=$('.price',d);let timer=0,lastQuery='';
const showSelected=p=>{d.dataset.productRef=String(p.product_ref||'');inp.value=p.product_name||'';sel.textContent=`✓ ${p.product_name||''}${p.brand?' · '+p.brand:''}`;sel.classList.remove('hidden');box.classList.add('hidden');if(!num(price.value)&&num(p.suggested_sale_price)>0)price.value=Math.round(num(p.suggested_sale_price));calcGrand()};
const renderResults=rows=>{if(!rows.length){box.innerHTML='<div class="product-loading">محصولی پیدا نشد.</div>';box.classList.remove('hidden');return}box.innerHTML=rows.map((p,i)=>`<div class="product-result" data-i="${i}"><strong>${esc(p.product_name||'محصول')}</strong><small>${p.brand?`<span>${esc(p.brand)}</span>`:''}${p.category?`<span>${esc(p.category)}</span>`:''}${num(p.suggested_sale_price)>0?`<span>${money(p.suggested_sale_price)}</span>`:''}${p.stock_qty!==null&&p.stock_qty!==undefined?`<span>موجودی ${fa(p.stock_qty)}</span>`:''}</small></div>`).join('');box.classList.remove('hidden');$$('.product-result',box).forEach(el=>el.onclick=()=>showSelected(rows[Number(el.dataset.i)]))};
const runSearch=async()=>{const q=inp.value.trim();lastQuery=q;box.innerHTML='<div class="product-loading">در حال جستجو…</div>';box.classList.remove('hidden');try{const rows=await searchCatalog(q);if(inp.value.trim()===lastQuery)renderResults(rows)}catch(e){box.innerHTML=`<div class="product-loading">خطا در دریافت محصولات: ${esc(e.message)}</div>`;box.classList.remove('hidden')}};
inp.addEventListener('input',()=>{if(inp.value.trim()!==sel.textContent.replace(/^✓\s*/,'')){d.dataset.productRef='';sel.classList.add('hidden')}clearTimeout(timer);timer=setTimeout(runSearch,280)});inp.addEventListener('focus',()=>{clearTimeout(timer);timer=setTimeout(runSearch,50)});inp.addEventListener('blur',()=>setTimeout(()=>box.classList.add('hidden'),220));
d.querySelector('.remove').onclick=()=>{d.remove();calcGrand()};d.querySelectorAll('.qty,.price,.disc').forEach(x=>x.addEventListener('input',calcGrand));return d}
function calcGrand(){let t=0;$$('.saleitem').forEach(r=>{t+=Math.max(0,num($('.qty',r).value))*Math.max(0,num($('.price',r).value))-Math.max(0,num($('.disc',r).value))});$('#grand').textContent=money(Math.max(0,t));return Math.max(0,t)}
async function submitSale(){const name=$('#custName').value.trim();if(!name){toast('نام مشتری الزامی است',true);return}const rows=$$('.saleitem').map(r=>({product_ref:String(r.dataset.productRef||'').trim(),quantity:Math.max(1,Math.round(num($('.qty',r).value)||1)),unit_sale_price:Math.max(0,num($('.price',r).value)),line_discount:Math.max(0,num($('.disc',r).value))}));if(!rows.length){toast('حداقل یک محصول انتخاب کن',true);return}if(rows.some(x=>!x.product_ref)){toast('همه محصولات باید از لیست هفت قلم انتخاب شوند',true);return}if(rows.some(x=>x.unit_sale_price<=0)){toast('قیمت فروش همه اقلام باید بیشتر از صفر باشد',true);return}const btn=$('#submitSale');btn.disabled=true;btn.textContent='در حال ارسال…';try{const result=await rpc('hg_submit_sales_request',{p_customer_name:name,p_customer_phone:$('#custPhone').value.trim()||null,p_customer_source:$('#source').value.trim()||null,p_payment_method:$('#pay').value,p_seller_note:$('#note').value.trim()||null,p_idempotency_key:crypto.randomUUID(),p_items:rows});const req=Array.isArray(result)?result[0]:result;if(!req?.id)throw Error('ثبت درخواست کامل نشد');toast(`درخواست #${fa(req.request_no||0)} برای مدیر ارسال شد ✅`);state.view='requests';state.catalogCache.clear();await loadAll();render()}catch(e){toast(e.message,true);btn.disabled=false;btn.textContent='ارسال برای مدیر'}}
function render(){if(!loadSession()?.access_token){loginScreen();return}if(!state.profile||state.profile.role!=='agent'||!state.agent){pendingLink();return}nav(true);$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));let html=state.view==='new'?newSale():state.view==='requests'?requests():state.view==='customers'?customers():state.view==='earnings'?earnings():home();$('#app').innerHTML=html;if(state.view==='new'){const box=$('#items');box.appendChild(itemRow());$('#addItem').onclick=()=>{box.appendChild(itemRow());calcGrand()};$('#submitSale').onclick=submitSale;calcGrand()}}
$$('#nav button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});$('#logoutBtn').onclick=()=>{saveSession(null);state.profile=state.agent=null;loginScreen()};
(async()=>{if(!cfg().key){configScreen();return}if(!loadSession()?.access_token){loginScreen();return}try{await loadAll();render()}catch(e){toast(e.message,true);loginScreen()}})();
})();
</script>
</body>
</html>
