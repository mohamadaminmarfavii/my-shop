const OFFLINE_DB='haftghalam-mobile-offline-v1', OFFLINE_STORE='kv';
let offlineDbPromise=null;
function openOfflineDb(){
  if(!('indexedDB' in window))return Promise.reject(new Error('IndexedDB در این مرورگر در دسترس نیست'));
  if(offlineDbPromise)return offlineDbPromise;
  offlineDbPromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open(OFFLINE_DB,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(OFFLINE_STORE))db.createObjectStore(OFFLINE_STORE)};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('باز کردن حافظه آفلاین ناموفق بود'));
  });
  return offlineDbPromise;
}
async function idbGet(key){
  const db=await openOfflineDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(OFFLINE_STORE,'readonly');
    const req=tx.objectStore(OFFLINE_STORE).get(key);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbSet(key,value){
  const db=await openOfflineDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(OFFLINE_STORE,'readwrite');
    tx.objectStore(OFFLINE_STORE).put(value,key);
    tx.oncomplete=()=>resolve(true);
    tx.onerror=()=>reject(tx.error);
    tx.onabort=()=>reject(tx.error||new Error('ذخیره آفلاین لغو شد'));
  });
}
async function idbDelete(key){
  const db=await openOfflineDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(OFFLINE_STORE,'readwrite');
    tx.objectStore(OFFLINE_STORE).delete(key);
    tx.oncomplete=()=>resolve(true);
    tx.onerror=()=>reject(tx.error);
  });
}

async function fetchJson(path,opt={},retry=true){
  const headers={'apikey':CFG.publishableKey,'Content-Type':'application/json',...(opt.headers||{})};
  if(opt.auth!==false&&S.session?.access_token)headers.Authorization=`Bearer ${S.session.access_token}`;
  const controller=new AbortController();
  const deadline=setTimeout(()=>controller.abort(),20000);
  let res;
  try{
  try{res=await fetch(CFG.supabaseUrl+path,{method:opt.method||'GET',headers,signal:controller.signal,body:opt.body===undefined?undefined:JSON.stringify(opt.body)})}catch(e){throw new Error('NETWORK:'+(e.name==='AbortError'?'پاسخ سرور بیش از ۲۰ ثانیه طول کشید؛ اتصال را بررسی و دوباره تلاش کن.':e.message))}
  if(res.status===401&&retry&&S.session?.refresh_token){await refreshSession();return fetchJson(path,opt,false)}
  const text=await res.text();let data=null;try{data=text?JSON.parse(text):null}catch{data=text}
  if(!res.ok){let msg=data?.message||data?.error_description||data?.hint||data?.details||`خطای ${res.status}`;if(data?.error_code==='invalid_credentials'||/invalid login credentials/i.test(String(msg)))msg='ایمیل یا رمز عبور اشتباه است';throw new Error(msg)}
  return data;
  }finally{clearTimeout(deadline)}
}

async function downloadFullCatalog(meta,show=true){
  if(S.catalogSyncing)return false;
  S.catalogSyncing=true;
  try{
    const pageSize=250;
    let offset=0, all=[];
    for(let page=0;page<20;page++){
      const rows=await fetchJson('/rest/v1/rpc/hg_trade_catalog',{method:'POST',body:{p_limit:pageSize,p_offset:offset}});
      const batch=Array.isArray(rows)?rows:[];
      all.push(...batch);
      if(batch.length<pageSize)break;
      offset+=pageSize;
    }
    const seen=new Set();
    const cleaned=all.filter(p=>{
      const k=String(p?.product_ref||'');
      if(!k||seen.has(k))return false;
      seen.add(k);
      return true;
    });
    const freshMeta=meta||await fetchCatalogMeta();
    const expected=Number(freshMeta?.product_count);
    if(Number.isFinite(expected)&&cleaned.length!==expected)throw new Error('دریافت کامل کاتالوگ انجام نشد. دوباره بروزرسانی کن.');
    const version="trade-v1|"+catalogMetaVersion(freshMeta);
    await persistCatalog(cleaned,version);
    updateChrome();
    if(show)toast(`لیست قیمت بروزرسانی شد · ${S.catalog.length.toLocaleString('fa-IR')} محصول`);
    renderCurrent();
    return true;
  }finally{
    S.catalogSyncing=false;
  }
}
async function ensureCatalogFresh(show=false,force=false){

    if(force)throw new Error('اینترنت قطع است؛ لیست آفلاین قبلی در دسترس است');

  }
  const meta=await fetchCatalogMeta();
  S.lastMetaCheck=Date.now();
  const version="trade-v1|"+catalogMetaVersion(meta);
  const expected=C.num(meta?.product_count);
  const same=!force&&S.catalog.length>0&&S.catalog.length===expected&&S.catalogVersion===version;
  if(same){
    if(show)toast(`لیست قیمت به‌روز است · ${S.catalog.length.toLocaleString('fa-IR')} محصول`);
    return false;

  return downloadFullCatalog(meta,show);
}

async function sendQueueItem(item){if(item.type==='order_edit'){return fetchJson('/rest/v1/rpc/hg_invoice_update',{method:'POST',body:{p_request_id:item.edit_request.id,p_expected_revision:item.edit_request.revision,p_payload:item.payload}});}if(item.type==='order'){await refreshLiveStock();if(!validStockCart(item.payload.p_items))throw new Error('موجودی اقلام کافی نیست. تعداد سفارش را اصلاح کن.');return fetchJson(item.payload.p_customer_type?'/rest/v1/rpc/hg_trade_submit':'/rest/v1/rpc/hg_mobile_submit_sales_request',{method:'POST',body:item.payload});}if(item.type==='price')return fetchJson('/rest/v1/rpc/hg_mobile_request_price_change',{method:'POST',body:item.payload});throw new Error('نوع صف ناشناخته است')}
async function syncQueue(show=true){if(S.syncing||!S.online||!S.session)return;S.syncing=true;let sent=0;try{for(const item of [...S.queue]){try{await sendQueueItem(item);S.queue=C.queueRemove(S.queue,item.idempotency_key);save(userKey(K.queue,S.session),S.queue);sent++}catch(e){if(String(e.message).startsWith('NETWORK:'))break;S.queue=C.queueMarkFailure(S.queue,item.idempotency_key,e.message);save(userKey(K.queue,S.session),S.queue)}}}finally{S.syncing=false;updateChrome()}if(show)toast(sent?`${sent.toLocaleString('fa-IR')} مورد همگام شد`:'صف آفلاین مورد قابل ارسال ندارد');if(sent)await refreshRequests(false)}
async function refreshRequests(show=true){
  if(!S.online){if(show)toast('آفلاین هستی؛ آخرین درخواست‌های ذخیره‌شده نمایش داده می‌شوند');return}

  S.priceRequests=Array.isArray(pr)?pr:[];save(userKey(K.priceRequests,S.session),S.priceRequests);
  const pendingOrders=S.orders.filter(x=>x.status==='submitted').length;
  const pendingPrices=S.priceRequests.filter(x=>x.status==='pending').length;
  const pending=pendingOrders+pendingPrices;
  const last=C.num(localStorage.getItem(K.lastPending));
  if(S.profile?.app_role==='manager'&&pending>last){
    const diff=pending-last;
    const latestPrice=S.priceRequests.find(x=>x.status==='pending');
    const msg=latestPrice&&pendingPrices>0
      ? `${diff.toLocaleString('fa-IR')} درخواست جدید برای بررسی · ${latestPrice.supplier_name||'تأمین‌کننده'}: ${latestPrice.product_name||'تغییر قیمت'}`
      : `${diff.toLocaleString('fa-IR')} درخواست جدید برای بررسی داری`;
    toast(msg);
    if(window.AndroidBridge?.notifyUser)window.AndroidBridge.notifyUser('هفت قلم',msg);
  }
  localStorage.setItem(K.lastPending,String(pending));
  updateChrome();
  if(show)toast('درخواست‌ها بروزرسانی شد');
  if(S.tab==='requests')renderRequests();
}

async function safeClearPageCache(){if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('haftghalam-web-shell-')).map(k=>caches.delete(k)))}if('serviceWorker' in navigator){const page=new URL(location.href);for(const reg of await navigator.serviceWorker.getRegistrations()){const worker=reg.active||reg.waiting||reg.installing;if(!worker)continue;const u=new URL(worker.scriptURL);if(u.origin===page.origin&&page.href.startsWith(reg.scope)&&/^haftghalam-mobile-web-sw-v[0-9.]+\.js$/.test(u.pathname.split('/').pop()))await reg.unregister()}}}
function renderSettings(){
  $('#content').innerHTML=`<div class="page-title">⚙️ تنظیمات</div><div class="page-sub">لیست محصولات در IndexedDB ذخیره می‌شود تا روی موبایل با چند هزار محصول به سقف localStorage نخورد. بررسی تغییرات مرجع هم خودکار انجام می‌شود.</div><div class="grid kpis"><div class="kpi"><span>وضعیت</span><strong>${S.online?'آنلاین':'آفلاین'}</strong></div><div class="kpi"><span>صف آفلاین</span><strong>${S.queue.length.toLocaleString('fa-IR')}</strong></div><div class="kpi"><span>محصول ذخیره</span><strong>${S.catalog.length.toLocaleString('fa-IR')}</strong></div><div class="kpi"><span>نسخه</span><strong>${esc(CFG.version)}</strong></div></div><div class="card"><div class="section-title">همگام‌سازی</div><button id="syncAll" class="btn primary block">↻ همگام‌سازی الآن</button><div class="alert" style="margin-top:9px">آخرین دریافت لیست قیمت: ${lastCatalogText()}<br>بررسی خودکار تغییرات: هنگام بازشدن/برگشت به صفحه و هر ۳۰ ثانیه. درخواست‌های جدید قیمت و سفارش هم هر ۳۰ ثانیه بررسی می‌شوند. دانلود کامل فقط وقتی خود محصولات تغییر کرده باشند.<br>اگر اینترنت قطع شود، سفارش‌ها در گوشی باقی می‌مانند و بعداً ارسال می‌شوند.</div></div><div class="card"><div class="section-title">فضا و کش</div><button id="clearCache" class="btn block">🧹 پاک کردن کش برنامه</button><button id="clearCatalog" class="btn block" style="margin-top:8px">پاک کردن لیست آفلاین محصولات</button><div class="alert warn" style="margin-top:9px">پاک کردن کش، سفارش‌های در صف را حذف نمی‌کند. پاک کردن لیست آفلاین فقط کاتالوگ ذخیره‌شده را پاک می‌کند.</div></div><div class="card"><button id="logout" class="btn red block">خروج از حساب</button></div>`;
  $('#syncAll').onclick=async()=>{try{await syncQueue(false);await syncCatalog(false,true);await refreshRequests(false);toast('همگام‌سازی کامل شد')}catch(e){toast(e.message,true)}};$('#clearCache').onclick=async()=>{try{await safeClearPageCache();toast('کش صفحه حذف شد؛ اطلاعات و سفارش‌ها حفظ شدند.');const u=new URL(location.href);u.searchParams.set('_fresh',String(Date.now()));location.replace(u.href)}catch(e){toast('تازه‌سازی صفحه انجام نشد',true)}};$('#clearCatalog').onclick=async()=>{if(confirm('لیست آفلاین محصولات پاک شود؟ سفارش‌های در صف حذف نمی‌شوند.')){try{await idbDelete(catalogCacheKey())}catch{}S.catalog=[];S.catalogVersion='';S.catalogSavedAt=0;localStorage.removeItem(K.legacyCatalog);localStorage.removeItem(K.catalogAt);updateChrome();renderCurrent();toast('لیست آفلاین پاک شد')}};$('#logout').onclick=logout;
}
window.hgOnNetworkChanged=async online=>{S.online=!!online;updateChrome();if(S.online&&S.session){try{await syncQueue(false);await ensureCatalogFresh(false,false);await refreshRequests(false);toast('اینترنت وصل شد؛ همگام‌سازی انجام شد')}catch(e){toast('اینترنت وصل است ولی Sync کامل نشد',true)}}};
window.addEventListener('online',()=>window.hgOnNetworkChanged(true));
window.addEventListener('offline',()=>window.hgOnNetworkChanged(false));
$('#loginForm').onsubmit=async event=>{event.preventDefault();await loginFormSubmit()};async function loginFormSubmit(){const b=$('#loginBtn');b.disabled=true;$('#loginMsg').textContent='';try{await login($('#email').value.trim(),$('#password').value,$('#rememberLogin').checked);$('#password').value='';toast('ورود انجام شد')}catch(e){if(!S.profile?.is_active)clearLogin();setAuthUI();$('#loginMsg').textContent=e.message;if(S.session&&S.profile)toast(e.message,true)}finally{b.disabled=false}};$('#modalClose').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});$$('.navbtn').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));



async function initApp(){
  try{await loadOfflineCatalog()}catch{}
  const rememberedEmail=localStorage.getItem(K.lastEmail)||'';
  if($('#email')&&!$('#email').value&&rememberedEmail)$('#email').value=rememberedEmail;
  setAuthUI();
  updateChrome();
  if(S.session)keepLoginFresh().then(()=>bootstrap()).catch(e=>{if(String(e.message).includes('فعال نشده')){clearLogin();setAuthUI();$('#loginMsg').textContent=e.message;}else {toast(e.message,true);if($('#content')){const box=document.createElement('div');box.className='card';box.textContent='آماده‌سازی کامل نشد: '+e.message+' — با دکمهٔ بروزرسانی دوباره تلاش کن.';$('#content').replaceChildren(box);}}});
}
async function autoRequestCheck(){
  if(!S.online||!S.session||document.visibilityState!=='visible')return;
  try{await refreshRequests(false)}catch{}
}
window.addEventListener('focus',()=>{keepLoginFresh().then(()=>{autoCatalogCheck();autoRequestCheck()})});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){autoCatalogCheck();autoRequestCheck()}});
setInterval(()=>{if(document.visibilityState==='visible'){autoCatalogCheck();autoRequestCheck()}},30000);
initApp();
})();
</script></body></html>
