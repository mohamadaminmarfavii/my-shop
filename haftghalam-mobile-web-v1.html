function bindProductActions(){
  $$('[data-add]').forEach(b=>b.onclick=()=>{const p=S.catalog.find(x=>x.product_ref===b.dataset.add);S.cart=C.upsertCart(S.cart,p,1);toast('به سفارش اضافه شد');setTab('order')});
  $$('[data-price]').forEach(b=>b.onclick=()=>openPriceModal(b.dataset.price));
}
function openPriceModal(ref){const p=S.catalog.find(x=>x.product_ref===ref);if(!p)return;modal('درخواست تغییر قیمت خرید',`<div class="alert">${esc(p.product_name)}<br>قیمت خرید فعلی: <b>${C.money(p.buy_price)} تومان</b></div><label style="display:block;margin:10px 0 5px;font-size:10px;font-weight:bold">قیمت خرید جدید</label><input id="newBuy" class="input" inputmode="numeric" value="${Math.round(C.num(p.buy_price)||0)}"><button id="sendPrice" class="btn primary block" style="margin-top:10px">ارسال برای تأیید مدیر</button>`);$('#sendPrice').onclick=()=>queueOrSendPrice(p,$('#newBuy').value)}
async function queueOrSendPrice(p,val){const newPrice=C.num(val);if(newPrice<=0)return toast('قیمت جدید معتبر نیست',true);const item={type:'price',idempotency_key:C.uuid(),payload:{p_product_ref:p.product_ref,p_proposed_buy_price:newPrice,p_idempotency_key:null},label:p.product_name};item.payload.p_idempotency_key=item.idempotency_key;if(!S.online){S.queue=C.queueAdd(S.queue,item);save(K.queue,S.queue);updateChrome();closeModal();return toast('درخواست قیمت آفلاین ذخیره شد')};try{await sendQueueItem(item);closeModal();toast('درخواست تغییر قیمت ارسال شد');await refreshRequests(false)}catch(e){if(String(e.message).startsWith('NETWORK:')){S.queue=C.queueAdd(S.queue,item);save(K.queue,S.queue);closeModal();toast('اینترنت قطع شد؛ درخواست در صف آفلاین ماند')}else toast(e.message,true)}}
function renderOrder(){
  const lines=S.cart.map((x,i)=>`<div class="cart-line"><div><b style="font-size:10px">${esc(x.product_name)}</b></div><input class="input" data-q="${i}" inputmode="numeric" value="${x.quantity}"><input class="input" data-sp="${i}" inputmode="numeric" value="${Math.round(C.num(x.unit_sale_price))}"><button class="btn red small" data-rm="${i}">×</button></div>`).join('');
  $('#content').innerHTML=`<div class="page-title">🧾 ثبت سفارش</div><div class="page-sub">در حالت آفلاین هم ثبت می‌شود و بعد از اتصال اینترنت ارسال خواهد شد.</div><div class="card"><div class="section-title">محصولات سفارش</div>${lines||'<div class="empty">هنوز محصولی انتخاب نشده؛ از تب محصولات اضافه کن.</div>'}<div class="cart-total"><span>جمع فروش</span><span id="cartTotal">${C.money(C.cartTotal(S.cart))} تومان</span></div></div><div class="card"><div class="section-title">مشخصات مشتری</div><input id="custName" class="input" placeholder="نام مشتری"><input id="custPhone" class="input" inputmode="tel" placeholder="شماره تماس" style="margin-top:8px"><select id="payMethod" class="select" style="margin-top:8px"><option value="cash">نقد / کارت‌به‌کارت</option><option value="snapp_pay">اسنپ‌پی</option><option value="site_gateway">درگاه سایت</option><option value="direct_installment">اقساط مستقیم</option><option value="other">سایر</option></select><textarea id="orderNote" class="textarea" rows="2" placeholder="توضیح سفارش" style="margin-top:8px"></textarea><button id="submitOrder" class="btn primary block" style="margin-top:10px">${S.online?'ارسال سفارش برای تأیید':'ذخیره سفارش آفلاین'}</button></div>`;
  $$('[data-q]').forEach(e=>e.onchange=()=>{S.cart[+e.dataset.q].quantity=Math.max(1,C.num(e.value));renderOrder()});$$('[data-sp]').forEach(e=>e.onchange=()=>{S.cart[+e.dataset.sp].unit_sale_price=Math.max(0,C.num(e.value));renderOrder()});$$('[data-rm]').forEach(e=>e.onclick=()=>{S.cart.splice(+e.dataset.rm,1);renderOrder()});$('#submitOrder').onclick=submitOrder;
}
async function submitOrder(){if(!S.cart.length)return toast('حداقل یک محصول اضافه کن',true);const form={customer_name:$('#custName').value,customer_phone:$('#custPhone').value,customer_source:'وب‌اپ هفت قلم',payment_method:$('#payMethod').value,seller_note:$('#orderNote').value,idempotency_key:C.uuid()};if(!form.customer_name.trim())return toast('نام مشتری لازم است',true);const payload=C.orderPayload(form,S.cart);const item={type:'order',idempotency_key:payload.p_idempotency_key,payload,label:form.customer_name};if(!S.online){S.queue=C.queueAdd(S.queue,item);save(K.queue,S.queue);S.cart=[];updateChrome();renderOrder();return toast('سفارش آفلاین ذخیره شد ✅')};try{const r=await sendQueueItem(item);S.cart=[];renderOrder();toast(`سفارش #${r?.request_no||''} برای تأیید ارسال شد`);await refreshRequests(false)}catch(e){if(String(e.message).startsWith('NETWORK:')){S.queue=C.queueAdd(S.queue,item);save(K.queue,S.queue);S.cart=[];updateChrome();renderOrder();toast('اینترنت قطع شد؛ سفارش در صف آفلاین ماند')}else toast(e.message,true)}}
async function sendQueueItem(item){if(item.type==='order')return fetchJson('/rest/v1/rpc/hg_mobile_submit_sales_request',{method:'POST',body:item.payload});if(item.type==='price')return fetchJson('/rest/v1/rpc/hg_mobile_request_price_change',{method:'POST',body:item.payload});throw new Error('نوع صف ناشناخته است')}
async function syncQueue(show=true){if(S.syncing||!S.online||!S.session)return;S.syncing=true;let sent=0;try{for(const item of [...S.queue]){try{await sendQueueItem(item);S.queue=C.queueRemove(S.queue,item.idempotency_key);save(K.queue,S.queue);sent++}catch(e){if(String(e.message).startsWith('NETWORK:'))break;S.queue=C.queueMarkFailure(S.queue,item.idempotency_key,e.message);save(K.queue,S.queue)}}}finally{S.syncing=false;updateChrome()}if(show)toast(sent?`${sent.toLocaleString('fa-IR')} مورد همگام شد`:'صف آفلاین مورد قابل ارسال ندارد');if(sent)await refreshRequests(false)}
async function refreshRequests(show=true){if(!S.online){if(show)toast('آفلاین هستی؛ آخرین درخواست‌های ذخیره‌شده نمایش داده می‌شوند');return}const ord=await fetchJson('/rest/v1/sales_requests?select=id,request_no,status,customer_name,customer_phone,payment_method,declared_total,seller_note,manager_note,agent_id,created_at,submitted_at&order=created_at.desc&limit=100');S.orders=Array.isArray(ord)?ord:[];save(K.orders,S.orders);const pr=await fetchJson('/rest/v1/mobile_price_change_requests?select=id,status,supplier_name,product_ref,product_name,old_buy_price,proposed_buy_price,manager_note,created_at,reviewed_at&order=created_at.desc&limit=100');S.priceRequests=Array.isArray(pr)?pr:[];save(K.priceRequests,S.priceRequests);const pending=S.orders.filter(x=>x.status==='submitted').length+S.priceRequests.filter(x=>x.status==='pending').length;const last=C.num(localStorage.getItem(K.lastPending));if(S.profile?.app_role==='manager'&&pending>last&&last>=0&&window.AndroidBridge?.notifyUser){window.AndroidBridge.notifyUser('هفت قلم','درخواست جدید برای بررسی داری')};localStorage.setItem(K.lastPending,String(pending));updateChrome();if(show)toast('درخواست‌ها بروزرسانی شد');if(S.tab==='requests')renderRequests()}
function statusBadge(s){const map={submitted:['در انتظار بررسی','orange'],approved:['تأیید شده','green'],rejected:['رد شده','red'],needs_revision:['نیاز به اصلاح','purple'],converted:['ثبت نهایی','green'],pending:['در انتظار','orange'],cancelled:['لغو','red']};const x=map[s]||[s,''];return `<span class="badge ${x[1]}">${x[0]}</span>`}
function renderRequests(){
  const isMgr=S.profile?.app_role==='manager';const orders=S.orders.map(r=>`<div class="request"><h4>سفارش #${esc(r.request_no)} · ${esc(r.customer_name)}</h4><p>${statusBadge(r.status)} · ${C.money(r.declared_total)} ت · ${esc(r.payment_method)}</p>${r.seller_note?`<p>یادداشت: ${esc(r.seller_note)}</p>`:''}${isMgr&&r.status==='submitted'?`<div class="request-actions"><button class="btn green small" data-or="approve" data-id="${r.id}">تأیید اولیه</button><button class="btn orange small" data-or="needs_revision" data-id="${r.id}">اصلاح</button><button class="btn red small" data-or="reject" data-id="${r.id}">رد</button></div>`:''}</div>`).join('');const prices=S.priceRequests.map(r=>`<div class="request"><h4>${esc(r.product_name)}</h4><p>${statusBadge(r.status)} · ${esc(r.supplier_name)}</p><p>خرید قبلی: <b>${C.money(r.old_buy_price)} ت</b> ← پیشنهادی: <b>${C.money(r.proposed_buy_price)} ت</b></p>${isMgr&&r.status==='pending'?`<div class="request-actions"><button class="btn green small" data-pr="approve" data-id="${r.id}">تأیید قیمت</button><button class="btn red small" data-pr="reject" data-id="${r.id}">رد</button></div>`:''}</div>`).join('');
  $('#content').innerHTML=`<div class="page-title">🔔 درخواست‌ها</div><div class="page-sub">سفارش‌ها وارد شبکه فروش می‌شوند؛ تبدیل نهایی به OMS همچنان در برنامه اصلی انجام می‌شود.</div><div class="toolbar"><button id="refreshReq" class="btn primary">↻ بروزرسانی</button></div><div class="card"><div class="section-title">سفارش‌ها</div>${orders||'<div class="empty">درخواستی نیست</div>'}</div><div class="card"><div class="section-title">تغییر قیمت خرید</div>${prices||'<div class="empty">درخواستی نیست</div>'}</div>`;$('#refreshReq').onclick=()=>refreshRequests();$$('[data-or]').forEach(b=>b.onclick=()=>reviewOrder(b.dataset.id,b.dataset.or));$$('[data-pr]').forEach(b=>b.onclick=()=>reviewPrice(b.dataset.id,b.dataset.pr));
}
async function reviewOrder(id,action){try{await fetchJson('/rest/v1/rpc/hg_mobile_review_sales_request',{method:'POST',body:{p_request_id:id,p_action:action,p_manager_note:null}});toast('وضعیت سفارش ثبت شد');await refreshRequests(false)}catch(e){toast(e.message,true)}}
async function reviewPrice(id,action){try{await fetchJson('/rest/v1/rpc/hg_mobile_review_price_change',{method:'POST',body:{p_request_id:id,p_action:action,p_manager_note:null}});toast(action==='approve'?'قیمت تأیید شد':'درخواست رد شد');await Promise.all([refreshRequests(false),syncCatalog(false)])}catch(e){toast(e.message,true)}}
function lastCatalogText(){const t=C.num(localStorage.getItem(K.catalogAt));if(!t)return 'هنوز انجام نشده';try{return new Date(t).toLocaleString('fa-IR')}catch{return '—'}}
function renderSettings(){
  $('#content').innerHTML=`<div class="page-title">⚙️ تنظیمات</div><div class="page-sub">کش ظاهری را می‌توانی پاک کنی بدون اینکه سفارش‌های آفلاین یا ورودت حذف شود.</div><div class="grid kpis"><div class="kpi"><span>وضعیت</span><strong>${S.online?'آنلاین':'آفلاین'}</strong></div><div class="kpi"><span>صف آفلاین</span><strong>${S.queue.length.toLocaleString('fa-IR')}</strong></div><div class="kpi"><span>محصول ذخیره</span><strong>${S.catalog.length.toLocaleString('fa-IR')}</strong></div><div class="kpi"><span>نسخه</span><strong>${esc(CFG.version)}</strong></div></div><div class="card"><div class="section-title">همگام‌سازی</div><button id="syncAll" class="btn primary block">↻ همگام‌سازی الآن</button><div class="alert" style="margin-top:9px">آخرین لیست قیمت: ${lastCatalogText()}<br>اگر اینترنت قطع شود، سفارش‌ها در گوشی باقی می‌مانند و بعداً ارسال می‌شوند.</div></div><div class="card"><div class="section-title">فضا و کش</div><button id="clearCache" class="btn block">🧹 پاک کردن کش برنامه</button><button id="clearCatalog" class="btn block" style="margin-top:8px">پاک کردن لیست آفلاین محصولات</button><div class="alert warn" style="margin-top:9px">پاک کردن کش، سفارش‌های در صف را حذف نمی‌کند. پاک کردن لیست آفلاین فقط کاتالوگ ذخیره‌شده را پاک می‌کند.</div></div><div class="card"><button id="logout" class="btn red block">خروج از حساب</button></div>`;
  $('#syncAll').onclick=async()=>{try{await syncQueue(false);await syncCatalog(false);await refreshRequests(false);toast('همگام‌سازی کامل شد')}catch(e){toast(e.message,true)}};$('#clearCache').onclick=async()=>{try{if('serviceWorker' in navigator&&navigator.serviceWorker.controller){navigator.serviceWorker.controller.postMessage({type:'REFRESH_CACHE'});toast('کش وب تازه‌سازی شد؛ سفارش‌های آفلاین حذف نشدند')}else if('caches' in window){for(const k of await caches.keys())await caches.delete(k);toast('کش وب پاک شد؛ سفارش‌های آفلاین حذف نشدند')}else toast('مرورگر مدیریت کش را پشتیبانی نمی‌کند')}catch(e){toast('پاک‌سازی کش انجام نشد',true)}};$('#clearCatalog').onclick=()=>{if(confirm('لیست آفلاین محصولات پاک شود؟ سفارش‌های در صف حذف نمی‌شوند.')){S.catalog=[];localStorage.removeItem(K.catalog);localStorage.removeItem(K.catalogAt);updateChrome();toast('لیست آفلاین پاک شد')}};$('#logout').onclick=logout;
}
window.hgOnNetworkChanged=async online=>{S.online=!!online;updateChrome();if(S.online&&S.session){try{await syncQueue(false);await syncCatalog(false);await refreshRequests(false);toast('اینترنت وصل شد؛ همگام‌سازی انجام شد')}catch(e){toast('اینترنت وصل است ولی Sync کامل نشد',true)}}};
window.addEventListener('online',()=>window.hgOnNetworkChanged(true));
window.addEventListener('offline',()=>window.hgOnNetworkChanged(false));
$('#loginBtn').onclick=async()=>{const b=$('#loginBtn');b.disabled=true;$('#loginMsg').textContent='';try{await login($('#email').value.trim(),$('#password').value);toast('ورود انجام شد')}catch(e){S.session=null;localStorage.removeItem(K.session);$('#loginMsg').textContent=e.message}finally{b.disabled=false}};$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click()});$('#modalClose').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});$$('.navbtn').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./haftghalam-mobile-web-sw-v1.js').catch(()=>{}));
}

setAuthUI();if(S.session)bootstrap().catch(e=>{toast(e.message,true);if(String(e.message).includes('فعال نشده')){}});updateChrome();
})();
</script></body></html>
